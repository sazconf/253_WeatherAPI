<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapTiler Geocoding</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>

<main>
    <p class="eyebrow">MapTiler Geocoding</p>
    <h1>Find a place.</h1>
    <p class="intro">Search for a city or location and explore the details returned by MapTiler.</p>

    <div class="student">
        <span><strong>Nama:</strong> Sazzad Hossain</span>
        <span><strong>NIM:</strong> 20240140253</span>
    </div>

    <div class="search-form">
        <label for="kota">Lokasi</label>
        <input type="text" id="kota" placeholder="Masukkan nama kota" aria-label="Nama kota">
        <button id="search" type="button">Search</button>
    </div>

    <h2 class="results-title">Location details</h2>
    <section class="results" aria-live="polite">
        <div class="result-row">
            <h4>Place name</h4>
            <p id="place"></p>
        </div>
        <div class="result-row">
            <h4>Matching text</h4>
            <p id="matching"></p>
        </div>
        <div class="result-row">
            <h4>Type</h4>
            <p id="type"></p>
        </div>
        <div class="result-row">
            <h4>Koordinat</h4>
            <p id="koordinat"></p>
        </div>
        <div class="result-row">
            <h4>Negara</h4>
            <p id="country"></p>
        </div>
        <div class="result-row">
            <h4>Provinsi</h4>
            <p id="province"></p>
        </div>
        <div class="result-row">
            <h4>Kecamatan</h4>
            <p id="district"></p>
        </div>
        <div class="result-row">
            <h4>Longitude</h4>
            <p id="longitude"></p>
        </div>
        <div class="result-row">
            <h4>Latitude</h4>
            <p id="latitude"></p>
        </div>
    </section>
</main>

<script>

    $("#search").click(function () {

        const kota = $("#kota").val();

        const urlapi =
            "https://api.maptiler.com/geocoding/" +
            kota +
            ".json?key=vAmiq80QREPciWItsF7w";

        $.ajax({
            url: urlapi,
            method: "GET",

            success: function(data) {

                console.log(data);

                const feature = data.features[0];
                const context = feature.context || [];
                const findContextValue = function(prefixes) {
                    const item = context.find(function(entry) {
                        return prefixes.some(function(prefix) {
                            return entry.id.startsWith(prefix);
                        });
                    });

                    return item ? item.text : "Tidak tersedia";
                };

                const place = document.getElementById("place");
                const matching = document.getElementById("matching");
                const type = document.getElementById("type");
                const koordinat = document.getElementById("koordinat");
                const coordinates = feature.geometry.coordinates;

                place.innerHTML = feature.place_name;
                matching.innerHTML = feature.matching_text || "Tidak tersedia";
                type.innerHTML = feature.place_type[0];
                koordinat.innerHTML = coordinates;
                document.getElementById("country").innerHTML =
                    findContextValue(["country"]);
                document.getElementById("province").innerHTML =
                    findContextValue(["region", "province"]);
                document.getElementById("district").innerHTML =
                    findContextValue(["district", "locality", "municipality"]);
                document.getElementById("longitude").innerHTML = coordinates[0];
                document.getElementById("latitude").innerHTML = coordinates[1];

            },

            error: function(error) {

                console.log(error);

                document.getElementById("place").innerHTML =
                    "Data tidak ditemukan";

                document.getElementById("matching").innerHTML = "";
                document.getElementById("type").innerHTML = "";
                document.getElementById("koordinat").innerHTML = "";
                document.getElementById("country").innerHTML = "";
                document.getElementById("province").innerHTML = "";
                document.getElementById("district").innerHTML = "";
                document.getElementById("longitude").innerHTML = "";
                document.getElementById("latitude").innerHTML = "";
            }

        });

    });

</script>

</body>
</html>
